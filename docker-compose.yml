# Local development stack: Milvus standalone (with its etcd + MinIO
# dependencies), Redis for the bus, and the worker itself.
#
# Milvus standalone is a single process and is the right shape for development
# and for small production deployments. Move to Zilliz Cloud or a distributed
# Milvus cluster when you outgrow one node - the client code does not change,
# only MILVUS_URI and MILVUS_TOKEN (see MilvusSettings.deployment in config.py).
#
# etcd/minio/milvus are tagged with the "self-hosted" profile, activated by
# COMPOSE_PROFILES=self-hosted in .env (Compose reads that file automatically
# from this directory - no extra flag needed). That is the toggle: with the
# profile active, `docker compose up -d` starts them same as always; drop or
# change COMPOSE_PROFILES once MILVUS_DEPLOYMENT=zilliz_cloud in .env, and the
# same command skips all three since there's nothing local left to run for
# Milvus - verified with `docker compose config --services` both ways.
# `worker` deliberately does NOT depends_on milvus any more (see its own
# comment below) specifically so it stays valid with the profile either way.
#
# `worker` also carries its own "container-worker" profile, off by default -
# `make up`/a bare `docker compose up -d` has always meant "bring up the
# local infra, run the actual pipeline yourself" (`make worker`/`make bot`),
# never "also start a second, containerized copy of it".

services:
  etcd:
    profiles: ["self-hosted"]
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    profiles: ["self-hosted"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    profiles: ["self-hosted"]
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # metrics / health
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    # Own profile, deliberately never active by default: `make up`/`docker
    # compose up -d` with no service names has always meant "the local
    # infra, run the actual pipeline from your venv" (see `make worker`/`make
    # bot`) - this container image is for an actual containerized deployment.
    # A bare `up` including it would silently start building and running a
    # second copy of the worker alongside whatever you're running locally.
    # Opt in explicitly: `docker compose --profile container-worker up -d`.
    profiles: ["container-worker"]
    build: .
    env_file: .env
    environment:
      # Falls back to the in-network self-hosted address only when .env
      # doesn't set MILVUS_URI itself. A bare hardcoded value here used to
      # win over .env unconditionally (`environment:` overrides `env_file:`
      # on a shared key) - so switching .env to a Zilliz Cloud URI silently
      # had no effect on this service, only on running the worker outside
      # Docker. This reads .env's value first, exactly like every other
      # consumer of it does.
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      BUS_REDIS_URL: redis://redis:6379/0
    depends_on:
      # NOT milvus - deliberately. `milvus` only exists in the "self-hosted"
      # profile, and a hard depends_on a profile-gated service makes the
      # WHOLE compose file fail validation the instant that profile is
      # inactive ("service depends on undefined service milvus"), even for
      # someone who only wanted `docker compose up -d redis`. There is no
      # Compose syntax for "depend on this service only if its profile is
      # active", and Zilliz Cloud has no local container to depend on anyway
      # - Compose's depends_on health-gating only ever works for OTHER
      # Compose-managed services, never an external one. `restart:
      # unless-stopped` below covers the gap this used to close: in
      # self-hosted mode, a worker that starts slightly before Milvus's
      # healthcheck passes now crash-loops until Milvus answers, instead of
      # Compose sequencing it for you.
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Scale horizontally: each replica joins the same consumer group and takes
    # a disjoint share of the stream.
    # deploy:
    #   replicas: 3
